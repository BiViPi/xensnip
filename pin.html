<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XenSnip Pin</title>
    <style>
      :root {
        --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        background: transparent;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: var(--font-sans);
        user-select: none;
        -webkit-user-select: none;
      }
      #pin-debug-fallback {
        position: fixed;
        inset: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        border: 1px solid rgba(15, 23, 42, 0.18);
        background: rgba(248, 250, 252, 0.96);
        color: #0f172a;
        font-size: 13px;
        line-height: 1.5;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="pin-debug-fallback">pin.html loaded; waiting for pin module...</div>
    <div id="root"></div>
    <script>
      window.__pinHtmlLoadedAt = Date.now();
      const fallback = document.getElementById("pin-debug-fallback");
      if (fallback) {
        fallback.textContent = "pin.html inline script ran; waiting for main.tsx...";
      }
      console.log("[PIN_HTML] inline script ran", window.location.href);
    </script>
    <script type="module" src="/src/pin/main.tsx"></script>
  </body>
</html>
